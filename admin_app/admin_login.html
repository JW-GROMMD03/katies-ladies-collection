<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katie's Staff Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 flex h-screen justify-center items-center">
    
    <div class="bg-white p-10 rounded-xl shadow-lg w-96 border border-slate-200">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-900 tracking-wider uppercase">Katie's Portal</h1>
            <p class="text-sm text-slate-500 mt-2">Authorized Personnel Only</p>
        </div>
        
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-5">
                <label class="block text-sm font-semibold text-slate-600 mb-2">Email Address</label>
                <input type="email" id="email" placeholder="admin@example.com" class="w-full p-3 border border-slate-300 rounded focus:outline-none focus:border-black transition" required>
            </div>
            
            <div class="mb-8">
                <label class="block text-sm font-semibold text-slate-600 mb-2">Password</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full p-3 border border-slate-300 rounded focus:outline-none focus:border-black transition" required>
            </div>

            <button type="submit" id="login-btn" class="w-full bg-slate-900 text-white font-bold py-3 rounded hover:bg-slate-800 transition">
                Secure Login
            </button>
            <p id="error-msg" class="text-red-500 text-sm text-center mt-4 hidden"></p>
        </form>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/auth';

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const errorMsg = document.getElementById('error-msg');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            btn.innerText = "Authenticating...";
            btn.disabled = true;
            errorMsg.classList.add('hidden');

            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('admin_token', data.token);
                    window.location.href = 'admin_dashboard.html';
                } else {
                    const error = await res.json();
                    errorMsg.innerText = error.detail || "Invalid credentials.";
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.innerText = "Server error. Is the backend running?";
                errorMsg.classList.remove('hidden');
            }

            btn.innerText = "Secure Login";
            btn.disabled = false;
        }
    </script>
</body>
</html>
